services:
  mariadb:
    build: ./requirements/mariadb       # 👈 WHERE to find the Dockerfile
    container_name: mariadb              # 👈 Name of the container
    restart: unless-stopped              # 👈 Auto-restart if it crashes
    environment:                         # 👈 Env vars injected INTO the container
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql   # 👈 Persist DB data on the host
    networks:
      - wp_network                       # 👈 Connect to this network

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      WP_USER_PASSWORD: ${WP_USER_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html        # 👈 Persist WP files on the host
    depends_on:
      - mariadb
    networks:
      - wp_network

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"   # Only HTTPS
    volumes:
      - wordpress_data:/var/www/html:ro             # 👈 Read-only access to WP files
    depends_on:
      - wordpress
    networks:
      - wp_network
  
  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - wp_network


# --------------------------
# Volumes (persistent storage)
# --------------------------
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mzeouaou/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mzeouaou/data/wp_webfiles

# --------------------------
# Network
# --------------------------
networks:
  wp_network:
    driver: bridge



